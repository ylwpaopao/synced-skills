name: Sync upstream skills

on:
  schedule:
    - cron: '23 2 * * 1' # Monday, Asia/Shanghai 10:23
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sources.json
      - scripts/**
      - tests/**
      - package.json
      - .github/workflows/sync-skills.yml

permissions:
  contents: write

concurrency:
  group: sync-upstream-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: Test synchronization
        run: bun test
      - name: Synchronize upstream skills
        run: bun run sync
      - name: Commit changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- skills licenses sources.lock.json
          if git diff --cached --quiet; then
            echo "Upstream skills and weekly check marker are unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync upstream skills'
          gh auth setup-git --hostname github.com
          git push origin HEAD:main
